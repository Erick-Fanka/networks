!Carregando a licença do roteador para telefonia
     enable
     configure terminal
     license boot module c2900 technology-package uck9
! (Ao colar, o roteador pedirá para aceitar os termos. Digite 'yes' manualmente)

!Criando sub interfaces para cada VLAN
 !Vlan 10
     interface gigabitEthernet 0/1.10
     encapsulation dot1Q 10
     ip address 192.168.10.1 255.255.255.0
     exit
 !Vlan 99
     interface gigabitEthernet 0/1.99
     encapsulation dot1Q 99
     ip address 192.168.99.1 255.255.255.0
     exit
 !Vlan 100
     interface gigabitEthernet 0/1.100
     encapsulation dot1Q 100
     ip address 192.168.100.1 255.255.255.0
     exit
!Vlan 150
     interface gigabitEthernet 0/1.150
     encapsulation dot1Q 150
     ip address 192.168.150.1 255.255.255.0
     exit
!Subindo interface física
     interface gigabitEthernet 0/1
     no shutdown
     exit
!Configurando DHCP 
 !Excluindo os IPs fixos 
     ip dhcp excluded-address 192.168.10.1
     ip dhcp excluded-address 192.168.99.1
     ip dhcp excluded-address 192.168.100.1
     ip dhcp excluded-address 192.168.150.1
 !Criando pools de endereços para cada VLAN
     ip dhcp pool DADOS
     network 192.168.10.0 255.255.255.0
     default-router 192.168.10.1
     dns-server 8.8.8.8
     exit
     ip dhcp pool GERENCIAMENTO
     network 192.168.99.0 255.255.255.0
     default-router 192.168.99.1
     dns-server 8.8.8.8
     exit
     ip dhcp pool NATIVA
     network 192.168.100.0 255.255.255.0
     default-router 192.168.100.1
     dns-server 8.8.8.8
     exit
     ip dhcp pool VOZ
     network 192.168.150.0 255.255.255.0
     default-router 192.168.150.1
     dns-server 8.8.8.8
     option 150 ip 192.168.150.1
     exit
!Configurando o call manager
     telephony-service
     max-ephones 2
     max-dn 2
     ip source-address 192.168.150.1 port 2000
     auto assign 1 to 2
     exit
!Configurando os ramais
     ephone-dn 1
     number 5540
     exit
     ephone-dn 2
     number 5541
     exit

!Validando e salvando
    do show ip interface brief
    exit
    write memory
    reload