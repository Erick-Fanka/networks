! Mudar nome do switch, habilitando senha e banner de login
    enable
    configure terminal
    hostname SW1
    enable secret cisco123 # troque a senha para uma mais segura
! Criando a Vlan inutilizada 999
    vlan 999
    name vlan-inutilizada
    interface range fastEthernet 0/1-24, gigabitEthernet 0/1-2
    switchport mode access
    switchport access vlan 999
    shutdown
    exit
!Verificando a configuração
    show ip interface brief # todas as interfaces devem estar em down
    show vlan brief # veja que todas as portas estão na vlan de trabalho
! Criando as vlans de trabalho
    vlan 10
    name vlan-dados
    vlan 150
    name vlan-voz
    vlan 99
    name vlan-gerenciamento
    vlan 100
    name vlan-nativa
! Verificando a configuração
    show vlan brief # veja que as vlans foram criadas
! Alocando as portas nas vlan de trabalho
    interface range fastEthernet 0/23-24
    switchport mode access
    switchport access vlan 10
    no shutdown
    exit
    interface range fastEthernet 0/1-2
    switchport mode access
    switchport voice vlan 150 * 
    mls qos trust cos **
    no shutdown
    exit

