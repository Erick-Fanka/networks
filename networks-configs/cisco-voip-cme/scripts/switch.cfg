! Mudar nome do switch, habilitando senha e banner de login
    enable
    configure terminal
    hostname SW1
! troque a senha abaixo para uma mais segura
    enable secret cisco123 
! Criando a Vlan inutilizada 999
    vlan 999
    name vlan-inutilizada
    interface range fastEthernet 0/1-24, gigabitEthernet 0/1-2
    switchport mode access
    switchport access vlan 999
    shutdown
    exit
! Verificando a configuracao (execute estes shows fora do modo de configuracao global se necessario, ou use 'do show')
! todas as interfaces devem estar em down
    do show ip interface brief 
! veja que todas as portas estao na vlan de trabalho
    do show vlan brief 
! Criando as vlans de trabalho
    vlan 10
    name vlan-dados
    vlan 150
    name vlan-voz
    vlan 99
    name vlan-gerenciamento
    vlan 100
    name vlan-nativa
! Verificando a configuracao
! veja que as vlans foram criadas
    do show vlan brief 
! Alocando as portas nas vlan de trabalho
    interface range fastEthernet 0/23-24
    switchport mode access
    switchport access vlan 10
    no shutdown
    exit
    interface range fastEthernet 0/1-2
    switchport mode access
    switchport voice vlan 150
    mls qos trust cos
    no shutdown
    exit
! Configurar uma porta para a vlan de gerenciamento
    interface fastEthernet 0/15
    switchport mode access
    switchport access vlan 99
    no shutdown
    exit
! Validando a configuracao
! vendo se as portas estao nas vlans corretas
    do show vlan brief 
! Configurando a porta trunk para o roteador
    interface gigabitEthernet 0/1
    switchport mode trunk
! a vlan 999 nao dever ser permitida no trunk
    switchport trunk allowed vlan 10,150,99 
! nao negociar o trunk de forma automatica
    switchport nonegotiate 
! indicando a vlan nativa, que nao sera tagueada
    switchport trunk native vlan 100 
    no shutdown
    end
! salvando a configuracao
    write memory 
! Validando a configuracao
    show vlan brief